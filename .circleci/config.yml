version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/base:current

jobs:
  build_and_push_docker_image:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: docker build -t my-dockerhub-username/my-app-image .
      - run:
          name: Login to Docker Hub
          command: echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
      - run:
          name: Push Docker Image to Docker Hub
          command: docker push my-dockerhub-username/my-app-image

  deploy_to_ec2:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Connect to EC2, Pull and Run Docker Image
          command: |
            ssh -o StrictHostKeyChecking=no ec2-user@$EC2_PUBLIC_IP << 'EOF'
              docker ps -q --filter ancestor=my-dockerhub-username/my-app-image | xargs -r docker stop
              docker pull my-dockerhub-username/my-app-image
              docker run -d my-dockerhub-username/my-app-image
            EOF

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build_and_push_docker_image
      - deploy_to_ec2:
          requires:
            - build_and_push_docker_image
          context: aws-context