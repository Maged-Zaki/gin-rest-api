version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/base:current

jobs:
  build_docker_image:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: docker build -t my-app-image .

  deploy_to_ec2:
    docker:
      - image: circleci/python:3.8
    steps:
      - checkout
      - run:
          name: Install AWS CLI
          command: pip install awscli
      - run:
          name: Configure AWS CLI
          command: |
            aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
            aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
            aws configure set default.region $AWS_DEFAULT_REGION
      - run:
          name: Connect to EC2 and Run Docker Image
          command: |
            ssh -o StrictHostKeyChecking=no ec2-user@$EC2_PUBLIC_IP << 'EOF'
              docker ps -q --filter ancestor=my-app-image | xargs -r docker stop
              docker run -d my-app-image
            EOF

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build_docker_image
      - deploy_to_ec2:
          requires:
            - build_docker_image
          context: aws-context